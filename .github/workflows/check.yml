# ============================================================
# `make check` on every push and every pull request.
#
# Why this exists: netcup pulls the repo itself, and the checkout IS the
# site. A push is therefore the publication — tools/deploy.sh runs afterwards
# and says as much ("They are already online"). So the check belongs before
# it, and the machine you push from has no PHP.
#
# Here it has one. A red mark on the commit reaches you before anybody opens
# the site.
#
# Nothing is built, nothing is installed: the site needs no Composer, no npm
# and no extension beyond what every PHP installation ships with.
# ============================================================

name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The same PHP as on the webspace. If it runs here, it runs there.
    container: php:8.2-cli

    steps:
      - uses: actions/checkout@v4

      # make is not part of the slim PHP image; running the two steps from
      # the check target directly is more honest than an apt-get for a
      # single line.
      - name: Syntax
        run: |
          failed=0
          for file in $(find lib sections public tools -name '*.php'); do
            php -l "$file" > /dev/null 2>&1 || { php -l "$file"; failed=1; }
          done
          [ $failed -eq 0 ] || { echo "The syntax error first, then everything else."; exit 1; }

      - name: Check the pages
        run: php tools/check.php
